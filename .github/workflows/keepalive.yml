# Ping Supabase otomatis agar proyek gratis tidak dijeda (inaktif 7 hari).
# Jalan tiap hari 03:17 UTC (10:17 WIB) dan bisa dijalankan manual dari
# tab Actions > "Supabase Keep Alive" > Run workflow.
# Simpan di: .github/workflows/keepalive.yml
name: Supabase Keep Alive

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write   # supaya GitHub tidak menonaktifkan jadwal setelah 60 hari repo sepi

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SB_URL: https://sfuucjmnlmfcghobpnkf.supabase.co
      SB_KEY: sb_publishable_E1m2fYO_8fyIc8WuZGjYiA_sFMphjBR
      SB_TABLE: portal_config
    steps:
      - name: Baca 1 baris dari tabel Supabase
        run: |
          curl --fail-with-body -sS --retry 3 --retry-delay 5 \
            "$SB_URL/rest/v1/$SB_TABLE?select=*&limit=1" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY"

      - name: Jaga workflow tetap aktif
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
