.klist{display:flex;flex-wrap:wrap;gap:.5rem;padding:.6rem;border:1px solid var(--bd);border-radius:.75rem;background:var(--inp)}.klist label.kopt{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .75rem;border:1px solid var(--bd);border-radius:.6rem;background:var(--card);color:var(--tx);font-size:.85rem;font-weight:600;cursor:pointer;user-select:none}.klist label.kopt:has(input:checked){border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.klist input[type=checkbox]{width:1.05rem;height:1.05rem;accent-color:var(--ac);cursor:pointer}.inp{width:100%;padding:.65rem 1rem;border:1px solid var(--bd);border-radius:.75rem;background:var(--inp);color:var(--tx);font-size:.875rem}
.inp:focus{outline:2px solid var(--ac)}
.lbl{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin-bottom:.25rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 1.1rem;border-radius:.75rem;background:var(--ac);color:#fff;font-weight:600;font-size:.875rem;border:1px solid var(--ac);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--ac2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn2{background:transparent;color:var(--tx);border-color:var(--bd)}.btn2:hover{background:var(--acs)}
.dg{background:transparent;color:var(--er);border-color:var(--er)}.dg:hover{background:transparent;opacity:.8}
.sm{padding:.35rem .7rem;font-size:.75rem;border-radius:.5rem}
.chip{padding:.6rem 1.1rem;border-radius:.75rem;border:1px solid var(--bd);background:var(--inp);color:var(--tx);font-weight:600;font-size:.875rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
.chip:hover{border-color:var(--ac)}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ic{width:2.5rem;height:2.5rem;border-radius:.75rem;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex:none}
.it{border:1px solid var(--bd);border-radius:.75rem;padding:.9rem;background:var(--inp)}
a.it:hover{border-color:var(--ac);background:var(--card)}
.tabs{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:1rem;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1rem;border-radius:.75rem;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:.75rem;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tag{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .6rem;border-radius:999px;font-size:.7rem;font-weight:700;background:var(--acs);color:var(--ac)}
.empty{text-align:center;padding:2rem 1rem;border:2px dashed var(--bd);border-radius:.75rem;color:var(--mu);font-size:.875rem}
.sbar{position:sticky;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.18);margin-bottom:0}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:grid;place-items:center;padding:1rem;z-index:50}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));z-index:60;background:#0f172a;color:#fff;padding:.7rem 1.1rem;border-radius:.75rem;font-size:.85rem;font-weight:600;max-width:92%;box-shadow:0 10px 30px rgba(0,0,0,.3)}

/* responsif: mobile & PC */
html{-webkit-text-size-adjust:100%}
button,.chip,.tab,.btn,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.grid>*{min-width:0}
.inp{min-height:2.6rem;min-width:0;max-width:100%}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,a.it:focus-visible,.inp:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hero{padding-top:calc(3.25rem + env(safe-area-inset-top,0px))}
header.hero,main{padding-left:max(1rem,env(safe-area-inset-left))!important;padding-right:max(1rem,env(safe-area-inset-right))!important}
#hK{overflow-wrap:anywhere}
.it b.truncate{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.modal{overflow:auto}
@media(min-width:640px){.hero{padding-top:calc(2rem + env(safe-area-inset-top,0px))}}
@media(min-width:768px){.tabs{flex-wrap:wrap;overflow-x:visible}}
@media(max-width:640px){.inp{font-size:16px}.acts>*{flex:1 1 calc(50% - .5rem)}.acts>.dg{flex:0 0 auto}}
@media(max-width:480px){.card{padding:1rem}.sbar{padding:.75rem}.sbar .btn{flex:1}}
@media(pointer:coarse){.btn.sm{padding:.55rem .85rem;min-height:2.5rem}.chip,.tab{min-height:2.75rem}}
/* tab hari (siswa): tampil semua, tanpa geser kiri-kanan */
#dtabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.25rem,1fr));gap:.4rem;overflow:visible;flex-wrap:wrap}
#dtabs .tab{min-width:0;width:100%;padding:.45rem .2rem;justify-content:center;text-align:center;line-height:1.15}
</style>

function cellVal(c,link){
  let v=c.value;

    if(v.richText)v=v.richText.map(r=>r.text).join('');
    else if(v.hyperlink)v=link?v.hyperlink:v.text;
    else if('result' in v)v=v.result;
    else if(v.text!=null)v=v.text;else v='';
  }
  if(v&&typeof v==='object'&&v.hyperlink)v=link?v.hyperlink:v.text;
  return v==null?'':v;
}

      if(er.length){errors.push({r,m:er.join('; ')});continue}
      new Set(ks.map(k=>isAll(k)?'*':k)).forEach(k=>{
        if(k!=='*'){const f=(S.classes[tk]||[]).concat(newCls[tk]||[]).find(x=>x.toLowerCase().replace(/\s+/g,'')===k.toLowerCase().replace(/\s+/g,''));if(f)k=f;else(newCls[tk]=newCls[tk]||[]).push(k)}
        const key=[tg,jam,judul,tk,k].join('|');if(seen.has(key))return;seen.add(key);
        rows.push({judul,tanggal:tg,jam,tingkat:tk,kelas:k,url});
      });
    }
    if(!rows.length&&!errors.length){toast('Tidak ada data yang terbaca di file ini.');return}
    imp={rows,errors,newCls,fname:file.name};render();
  }catch(e){toast('File tidak dapat dibaca. Gunakan file .xlsx (bukan .xls/.csv).')}
}
function applyImp(replace){
  const pubNow=!!($('ipub')&&$('ipub').checked);
  if(replace)S.items=[];
  const key=i=>[i.tanggal,i.jam,i.judul.toLowerCase(),i.tingkat,i.kelas,i.url].join('|'),have=new Set(S.items.map(key));let n=0;
  imp.rows.forEach(r=>{if(have.has(key(r)))return;have.add(key(r));S.items.push({id:newId(),akses:'auto',terbit:pubNow,...r});n++});
  Object.entries(imp.newCls).forEach(([t,ks])=>ks.forEach(k=>{if(!S.classes[t].includes(k))S.classes[t].push(k)}));
  dirty=true;imp=null;toast(n+(pubNow?' tombol diimpor dan diterbitkan.':' tombol diimpor sebagai draf. Terbitkan agar tampil bagi siswa.'));return pubNow&&n>0;
}

async function sbFetch(path,opt){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),10000);
  try{
    const r=await fetch(SB_URL+'/rest/v1/'+path,Object.assign({signal:ac.signal},opt,{headers:Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},opt&&opt.headers)}));
    const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){}
    if(!r.ok){const e=new Error((j&&(j.message||j.hint))||('HTTP '+r.status));e.status=r.status;e.code=j&&j.code;throw e}
    return j;
  }finally{clearTimeout(t)}
}
function applyRemote(d){
  if(!d||!Array.isArray(d.items)||!Array.isArray(d.levels)||!d.levels.length)return false;
  Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,d);

/* Ping database: menulis 1 baris ke tabel portal_ping supaya proyek Supabase tetap dianggap aktif.
   Jika fungsi ping_portal belum dibuat di SQL, jatuh ke baca tabel portal_config (tetap dihitung aktivitas). */
let pingInfo=null;
async function sbPing(manual){
  const t0=Date.now();
  try{
    let via='ping_portal',tw=null;
    try{tw=await sbFetch('rpc/ping_portal',{method:'POST',body:JSON.stringify({p_sumber:manual?'panitia':'otomatis'})})}
    catch(e){
      if(!(e&&(e.code==='PGRST202'||e.status===404)))throw e;
      via='portal_config';await sbFetch('portal_config?id=eq.'+SB_ID+'&select=id&limit=1');
    }
    pingInfo={ok:true,ms:Date.now()-t0,via,waktu:new Date().toISOString(),db:tw};
    try{localStorage.setItem('wm_ping',String(Date.now()))}catch(e){}
  }catch(e){
    pingInfo={ok:false,ms:Date.now()-t0,msg:String(e&&e.message||'gagal'),waktu:new Date().toISOString()};
  }
  if(manual&&edit&&tab==='judul'&&!askPw&&!showForm)render();
  return pingInfo;
}
function pingAuto(){
  let last=0;try{last=+localStorage.getItem('wm_ping')||0}catch(e){}
  if(Date.now()-last>6*3600*1000)sbPing(false);
}
